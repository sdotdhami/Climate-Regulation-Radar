name: Regulation Radar

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 6am UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab, for testing

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the workflow can commit the updated state file back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests gspread google-auth pandas

      - name: Run radar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python regulation_radar.py

      - name: Commit updated state file
        run: |
          git config user.name "regulation-radar-bot"
          git config user.email "actions@github.com"
          git add radar_state.json
          git commit -m "Update radar state" || echo "No changes to commit"
          git push
